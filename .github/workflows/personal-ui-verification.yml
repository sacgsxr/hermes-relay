name: Personal UI verification

run-name: Personal UI verification · ${{ inputs.head_sha || 'b8a162106d439a94a066924f49b64bdb83ac1bc2' }} · ${{ inputs.preset || 'focused' }}

on:
  push:
    branches:
      - ci/relay-ui-verification
  workflow_dispatch:
    inputs:
      head_sha:
        description: Exact lowercase 40-character source commit SHA
        required: true
        type: string
      preset:
        description: Nonpublishing Android verification lane
        required: true
        type: choice
        options:
          - focused
          - assemble-debug

permissions:
  contents: read

jobs:
  verify:
    name: Reuse Android on-demand checks
    uses: ./.github/workflows/android-on-demand.yml
    with:
      head_sha: ${{ inputs.head_sha || 'b8a162106d439a94a066924f49b64bdb83ac1bc2' }}
      preset: ${{ inputs.preset || 'focused' }}
    permissions:
      contents: read
